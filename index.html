<script>

const waLink = (num, msg) => `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;

const todayISO = () => new Date().toISOString().slice(0, 10);
const addMonthISO = (dateStr) => { const d = dateStr ? new Date(dateStr) : new Date(); d.setMonth(d.getMonth() + 1); return d.toISOString().slice(0, 10); };

function notifyBackend(entry, groupName) {
  const url = STATE.settings.scriptUrl;
  if (!url) return; // لم يُضبط رابط جوجل شيت بعد
  try {
    fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: entry.name, phone: entry.phone, groupName, institution: entry.institution, wilaya: entry.wilaya, commune: entry.commune, note: entry.note, createdAt: entry.createdAt }),
    }).catch(() => {});
  } catch { /* تجاهل بصمت إن تعذّر الإرسال */ }
}

/* ------------------------------------------------------------------ */
/*  تخزين محلي                                                        */
/* ------------------------------------------------------------------ */
function storGet(key, fallback) {
  try { const raw = localStorage.getItem("zdn_" + key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function storSet(key, value) {
  try { localStorage.setItem("zdn_" + key, JSON.stringify(value)); return true; }
  catch { return false; }
}

/* ------------------------------------------------------------------ */

  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',

  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/>',

/* ------------------------------------------------------------------ */

  page: "home", // home | register | dashboardLogin | dashboard | lessons
  dashTab: "overview",

  groups: storGet("groups", DEFAULT_GROUPS),
  settings: Object.assign({ email: DEFAULT_EMAIL, passcode: DEFAULT_PASSCODE, scriptUrl: DEFAULT_SCRIPT_URL, zoomLink: DEFAULT_ZOOM_LINK }, storGet("settings", {})),
  regFilter: "all",
  registeredEntry: null,
  remoteRegs: [],
  remoteStatus: "idle", // idle | loading | ok | error
  subscriptions: storGet("subscriptions", {}), // keyed by phone: { paidUntil, lastPaymentDate }
  remoteCodes: {}, // keyed by phone: { code, bound, active }
  remoteLessons: [],
  lessonsStatus: "idle", // idle | loading | ok | error
  deviceId: storGet("deviceId", "") || uid() + uid(),
  lessonsAccess: storGet("lessonsAccess", null), // { code, name } | null

storSet("deviceId", STATE.deviceId);

function fetchRemoteRegs() {
  if (!STATE.settings.scriptUrl) { STATE.remoteStatus = "error"; render(); return; }
  STATE.remoteStatus = "loading";
  render();
  fetch(STATE.settings.scriptUrl)
    .then((r) => r.json())
    .then((data) => {
      STATE.remoteRegs = (data && data.registrations) || [];
      STATE.remoteCodes = (data && data.codes) || {};
      STATE.remoteStatus = "ok";
      render();
    })
    .catch(() => {
      STATE.remoteStatus = "error";
      render();
    });
}

function fetchLessons(cb) {
  if (!STATE.settings.scriptUrl) { STATE.lessonsStatus = "error"; render(); return; }
  STATE.lessonsStatus = "loading";
  render();
  fetch(STATE.settings.scriptUrl + "?action=lessons")
    .then((r) => r.json())
    .then((data) => {
      STATE.remoteLessons = (data && data.lessons) || [];
      STATE.lessonsStatus = "ok";
      render();
      if (cb) cb();
    })
    .catch(() => {
      STATE.lessonsStatus = "error";
      render();
    });
}

function scriptPost(payload) {
  return fetch(STATE.settings.scriptUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  }).then((r) => r.json());
}

function verifyLessonsCode(code, statusEl) {
  STATE.lessonsVerifyMsg = "جارٍ التحقق...";
  render();
  scriptPost({ action: "verifyCode", code: code, deviceId: STATE.deviceId })
    .then((res) => {
      if (res && res.ok) {
        STATE.lessonsAccess = { code: code.toUpperCase(), name: res.name || "" };
        storSet("lessonsAccess", STATE.lessonsAccess);
        STATE.lessonsVerifyMsg = "";
        fetchLessons();
      } else {
        const map = { device_mismatch: "هذا الرمز مستعمل بالفعل من جهاز آخر.", revoked: "تم إلغاء هذا الرمز من طرف الأستاذ.", invalid_code: "الرمز غير صحيح." };
        STATE.lessonsVerifyMsg = map[res && res.error] || "تعذّر التحقق من الرمز.";
        render();
      }
    })
    .catch(() => { STATE.lessonsVerifyMsg = "تعذّر الاتصال بالخادم، تحقق من الإنترنت."; render(); });
}

function embedForLesson_(l) {
  const driveMatch = (l.url || "").match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) {
    return `<iframe src="https://drive.google.com/file/d/${driveMatch[1]}/preview" style="width:100%;height:480px;border:0;border-radius:12px" allow="autoplay" allowfullscreen></iframe>`;
  }
  const ytMatch = (l.url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
  if (ytMatch) {
    return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" style="width:100%;height:480px;border:0;border-radius:12px" allowfullscreen></iframe>`;
  }
  return `<a class="btn btn-outline" target="_blank" rel="noopener noreferrer" href="${esc(l.url)}">${icon("video",16)} فتح الدرس</a><p class="hint">تنبيه: هذا الرابط لا يخضع لحماية "عرض فقط" داخل الموقع.</p>`;}

        <div class="flex1"><div class="reg-name">${esc(g.name)}</div><div class="muted" style="font-size:.88rem">${esc(g.subject)}</div></div>
        <div class="g-line">${icon("calendar",14)} ${esc(g.day)}</div>
        <div class="g-line">${icon("clock",14)} ${esc(g.time)}</div>
        <div style="font-size:.9rem">سعة: ${g.capacity}</div>
        <button class="icon-btn icon-trash" data-remove-group="${g.id}">${icon("trash",17)}</button>
      </div>`).join("")}
  </div>
  <form id="form-add-group" class="g-form" style="margin-top:10px">
    <label class="field"><span>اسم الفوج</span><input name="name" placeholder="فوج آداب وفلسفة" /></label>
    <label class="field"><span>المادة/المحور</span><input name="subject" placeholder="تحضير بكالوريا" /></label>
    <label class="field"><span>اليوم</span><select name="day">${days.map(d=>`<option value="${d}">${d}</option>`).join("")}</select></label>
    <label class="field"><span>التوقيت</span><input name="time" placeholder="16:00 - 17:30" dir="ltr" /></label>
    <label class="field"><span>السعة القصوى</span><input type="number" name="capacity" min="1" value="15" /></label>
    <div style="display:flex;align-items:flex-end">
      <button type="submit" class="btn btn-dark" style="width:100%;justify-content:center">${icon("plus",17)} إضافة فوج</button>
    </div>
  </form>`;
}

function lessonsManagerHtml() {
  const statusBanner = STATE.lessonsStatus === "loading" ? `<div class="empty">جارٍ التحميل...</div>`
    : STATE.lessonsStatus === "error" ? `<div class="settings-note" style="margin-bottom:16px">تعذّر الاتصال بالخادم.</div>` : "";

  const list = STATE.remoteLessons.length === 0 ? `<div class="empty">لا توجد دروس بعد. أضف أول درس بالأسفل.</div>` :
    STATE.remoteLessons.map(l => `
      <div class="g-manage-row">
        <div class="flex1"><div class="reg-name">${esc(l.title)}</div><div class="muted" style="font-size:.85rem">${l.type === "video" ? "فيديو" : "PDF"} — <span dir="ltr">${esc(l.url)}</span></div></div>
        <button class="icon-btn icon-trash" data-remove-lesson data-lesson-title="${esc(l.title)}" data-lesson-url="${esc(l.url)}">${icon("trash",17)}</button>
      </div>`).join("");

  return `
  <div>
    <div class="settings-note" style="margin-bottom:16px">
      ارفع ملف PDF أو فيديو على Google Drive، فعّل خيار "تقييد التنزيل/الطباعة/النسخ" من إعدادات مشاركة الملف في Drive، ثم الصق رابط المشاركة هنا. لروابط يوتيوب: استعمل فيديو "غير مُدرَج" (Unlisted).
    </div>
    ${statusBanner}
    ${list}
    <form id="form-add-lesson" class="g-form" style="margin-top:16px">
      <label class="field"><span>عنوان الدرس</span><input name="title" placeholder="مثال: النحو — الدرس 1" /></label>
      <label class="field"><span>النوع</span>
        <select name="type"><option value="pdf">PDF</option><option value="video">فيديو</option></select>
      </label>
      <label class="field" style="grid-column:1/-1"><span>رابط Google Drive أو YouTube</span><input name="url" placeholder="https://drive.google.com/file/d/..." dir="ltr" /></label>
      <div style="display:flex;align-items:flex-end;grid-column:1/-1">
        <button type="submit" class="btn btn-dark" style="width:100%;justify-content:center">${icon("plus",17)} إضافة الدرس</button>
      </div>
    </form>
  </div>`;
}

function settingsPanelHtml() {
  return `
  <div class="settings-grid">
    <form id="form-settings-email" class="card">
      <h3 style="margin:0 0 6px">بيانات التواصل</h3>
      <label class="field"><span>البريد الإلكتروني لاستقبال طلبات التسجيل</span>
        <input type="email" name="email" value="${esc(STATE.settings.email)}" placeholder="example@gmail.com" dir="ltr" />
      </label>
      <p class="hint" style="margin:-6px 0 12px">رقم الواتساب الظاهر للطلبة: 0671143821 (مضبوط مسبقاً)</p>
      <label class="field"><span>رابط اجتماع Zoom (اختياري — يظهر زر "الانضمام" للطلبة)</span>
        <input type="url" name="zoomLink" value="${esc(STATE.settings.zoomLink || "")}" placeholder="https://zoom.us/j/..." dir="ltr" />
      </label>
      <label class="field"><span>رابط ربط Google Sheets (لتسجيل تلقائي وبريد فوري)</span>
        <input type="url" name="scriptUrl" value="${esc(STATE.settings.scriptUrl || "")}" placeholder="https://script.google.com/macros/s/.../exec" dir="ltr" />
      </label>
      <button type="submit" class="btn btn-dark">حفظ</button>
      <div id="email-saved-msg"></div>
    </form>
    <form id="form-settings-pass" class="card">
      <h3 style="margin:0 0 6px">تغيير رمز دخول فضاء الأستاذ</h3>
      <label class="field"><span>الرمز الجديد</span><input type="password" name="pass1" dir="ltr" /></label>
      <label class="field"><span>تأكيد الرمز الجديد</span><input type="password" name="pass2" dir="ltr" /></label>
      <button type="submit" class="btn btn-dark">تحديث الرمز</button>
      <div id="pass-msg"></div>
    </form>
    <div class="settings-note">
      ملاحظة مهمة: قائمة "التسجيلات والمستحقات" في هذه الصفحة تعرض فقط التسجيلات التي تمت من *هذا الجهاز/المتصفح تحديداً* — وليست شاملة لكل الطلبة. المصدر الكامل والموثوق لكل التسجيلات (من جميع الطلبة، من أي جهاز) هو جدول Google Sheets نفسه — افتحه من تطبيق Sheets على الهاتف للاطّلاع على القائمة الكاملة دائماً.
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ */
/*  الترسيم والأحداث                                                  */
/* ------------------------------------------------------------------ */
function render() {
  let pageHtml = "";
  if (STATE.page === "home") {
    pageHtml = heroHtml() + aboutHtml() + stepsHtml() + groupsPreviewHtml();
  } else if (STATE.page === "register") {
    pageHtml = registerPageHtml();
  } else if (STATE.page === "dashboardLogin") {
    pageHtml = dashboardLoginHtml(STATE._loginErr);
  } else if (STATE.page === "dashboard") {
    pageHtml = dashboardHtml();
  } else if (STATE.page === "lessons") {
    pageHtml = lessonsPageHtml();
  }

  document.getElementById("root").innerHTML = `
    <nav class="top">
      <button id="btn-nav-logo" style="background:none;border:none;cursor:pointer">${logoHtml(22)}</button>
      <div class="navlinks">
        <button id="btn-nav-register">التسجيل</button>
        <button id="btn-nav-lessons">${icon("video",13)} الدروس</button>
        <button id="btn-nav-dash">${icon("lock",13)} فضاء الأستاذ</button>
      </div>
    </nav>
    ${pageHtml}
    ${footerHtml()}
  `;

  attachHandlers();
  if (STATE.page === "lessons" && STATE.lessonsAccess && STATE.lessonsStatus === "idle") fetchLessons();
}

function attachHandlers() {
  const $ = (id) => document.getElementById(id);

  if ($("btn-nav-logo")) $("btn-nav-logo").onclick = () => go("home");
  if ($("btn-nav-register")) $("btn-nav-register").onclick = () => go("register");
  if ($("btn-nav-lessons")) $("btn-nav-lessons").onclick = () => go("lessons");
  if ($("btn-nav-dash")) $("btn-nav-dash").onclick = () => go(STATE.page === "dashboard" ? "dashboard" : "dashboardLogin");
  if ($("btn-foot-dash")) $("btn-foot-dash").onclick = () => go(STATE.page === "dashboard" ? "dashboard" : "dashboardLogin");
  if ($("btn-hero-register")) $("btn-hero-register").onclick = () => go("register");
  if ($("btn-groups-register")) $("btn-groups-register").onclick = () => go("register");
  if ($("btn-back-home")) $("btn-back-home").onclick = () => { STATE.registeredEntry = null; go("home"); };
  if ($("btn-dash-home")) $("btn-dash-home").onclick = () => go("home");

  if ($("form-register")) {
    $("form-register").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const entry = {
        id: uid(),
        name: f.name.value.trim(),
        phone: f.phone.value.trim(),
        groupId: f.groupId.value,
        institution: f.institution.value.trim(),
        wilaya: f.wilaya.value,
        commune: f.commune.value.trim(),
        note: f.note.value.trim(),
        paidUntil: "",
        lastPaymentDate: "",
        createdAt: new Date().toISOString(),
      };
      if (!entry.name || !entry.phone || !entry.groupId || !entry.institution || !entry.wilaya || !entry.commune) return;
      STATE.regs.push(entry);
      storSet("registrations", STATE.regs);
      const grp = STATE.groups.find(g => g.id === entry.groupId);
      notifyBackend(entry, grp ? grp.name : "");
      STATE.registeredEntry = entry;
      render();
      window.scrollTo(0,0);
    };
  }

  if ($("form-login")) {
    $("form-login").onsubmit = (e) => {
      e.preventDefault();
      const val = e.target.passcode.value;
      if (val === (STATE.settings.passcode || DEFAULT_PASSCODE)) {
        STATE._loginErr = false;
        go("dashboard");
        if (STATE.remoteStatus === "idle") fetchRemoteRegs();
      } else {
        STATE._loginErr = true;
        render();
      }
    };
  }

  if ($("form-lessons-code")) {
    $("form-lessons-code").onsubmit = (e) => {
      e.preventDefault();
      const code = e.target.code.value.trim();
      if (!code) return;
      verifyLessonsCode(code);
    };
  }
  if ($("btn-lessons-logout")) {
    $("btn-lessons-logout").onclick = () => {
      STATE.lessonsAccess = null;
      storSet("lessonsAccess", null);
      go("home");
    };
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => {
      STATE.dashTab = btn.getAttribute("data-tab");
      render();
      if (STATE.dashTab === "regs" && STATE.remoteStatus === "idle") fetchRemoteRegs();
      if (STATE.dashTab === "lessons" && STATE.lessonsStatus === "idle") fetchLessons();
    };
  });
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => { STATE.regFilter = btn.getAttribute("data-filter"); render(); };
  });
  if ($("btn-refresh-regs")) $("btn-refresh-regs").onclick = () => fetchRemoteRegs();

  document.querySelectorAll("[data-renew]").forEach(btn => {
    btn.onclick = () => {
      const phone = btn.getAttribute("data-renew");
      const current = STATE.subscriptions[phone] || {};
      const base = (current.paidUntil && current.paidUntil >= todayISO()) ? current.paidUntil : todayISO();
      STATE.subscriptions[phone] = { paidUntil: addMonthISO(base), lastPaymentDate: todayISO() };
      storSet("subscriptions", STATE.subscriptions);
      render();
    };
  });
  document.querySelectorAll("[data-paid-until]").forEach(input => {
    input.onchange = () => {
      const phone = input.getAttribute("data-paid-until");
      STATE.subscriptions[phone] = { ...(STATE.subscriptions[phone]||{}), paidUntil: input.value };
      storSet("subscriptions", STATE.subscriptions);
      render();
    };
  });
  document.querySelectorAll("[data-payment-date]").forEach(input => {
    input.onchange = () => {
      const phone = input.getAttribute("data-payment-date");
      STATE.subscriptions[phone] = { ...(STATE.subscriptions[phone]||{}), lastPaymentDate: input.value };
      storSet("subscriptions", STATE.subscriptions);
      render();
    };
  });
  document.querySelectorAll("[data-remove-reg]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-remove-reg");
      STATE.regs = STATE.regs.filter(r => r.id !== id);
      storSet("registrations", STATE.regs);
      render();
    };
  });
  document.querySelectorAll("[data-remove-group]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-remove-group");
      STATE.groups = STATE.groups.filter(g => g.id !== id);
      storSet("groups", STATE.groups);
      render();
    };
  });

  if ($("form-add-group")) {
    $("form-add-group").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (!f.name.value.trim() || !f.time.value.trim()) return;
      STATE.groups.push({
        id: uid(), name: f.name.value.trim(), subject: f.subject.value.trim(),
        day: f.day.value, time: f.time.value.trim(), capacity: Number(f.capacity.value) || 15,
      });
      storSet("groups", STATE.groups);
      render();
    };
  }

  if ($("form-add-lesson")) {
    $("form-add-lesson").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (!f.title.value.trim() || !f.url.value.trim()) return;
      scriptPost({ action: "addLesson", title: f.title.value.trim(), type: f.type.value, url: f.url.value.trim(), adminKey: STATE.settings.passcode })
        .then((res) => { if (res && res.ok) fetchLessons(); });
    };
  }
  document.querySelectorAll("[data-remove-lesson]").forEach(btn => {
    btn.onclick = () => {
      scriptPost({ action: "removeLesson", title: btn.getAttribute("data-lesson-title"), url: btn.getAttribute("data-lesson-url"), adminKey: STATE.settings.passcode })
        .then((res) => { if (res && res.ok) fetchLessons(); });
    };
  });

  document.querySelectorAll("[data-issue-code]").forEach(btn => {
    btn.onclick = () => {
      const phone = btn.getAttribute("data-issue-code");
      const name = btn.getAttribute("data-issue-name") || "";
      btn.disabled = true;
      scriptPost({ action: "issueCode", phone: phone, name: name, adminKey: STATE.settings.passcode })
        .then((res) => {
          if (res && res.ok) {
            STATE.remoteCodes[phone] = { code: res.code, bound: false, active: true };
            render();
            window.open(waLink(phone.replace(/[^0-9]/g,""), `مرحباً ${name}، رمز دخولك إلى فضاء الدروس هو: ${res.code}\nهذا الرمز خاص بجهازك الأول فقط، لا تشاركه مع أحد.`), "_blank");
          }
        });
    };
  });
  document.querySelectorAll("[data-revoke-code]").forEach(btn => {
    btn.onclick = () => {
      const phone = btn.getAttribute("data-revoke-code");
      scriptPost({ action: "revokeCode", phone: phone, adminKey: STATE.settings.passcode })
        .then((res) => { if (res && res.ok) { if (STATE.remoteCodes[phone]) STATE.remoteCodes[phone].active = false; render(); } });
    };
  });

  if ($("form-settings-email")) {
    $("form-settings-email").onsubmit = (e) => {
      e.preventDefault();
      STATE.settings.email = e.target.email.value.trim();
      STATE.settings.zoomLink = e.target.zoomLink.value.trim();
      STATE.settings.scriptUrl = e.target.scriptUrl.value.trim();
      storSet("settings", STATE.settings);
      $("email-saved-msg").innerHTML = `<div class="ok-msg">${icon("check",15)} تم الحفظ</div>`;
      setTimeout(() => { if ($("email-saved-msg")) $("email-saved-msg").innerHTML = ""; }, 2500);
    };
  }
  if ($("form-settings-pass")) {
    $("form-settings-pass").onsubmit = (e) => {
      e.preventDefault();
      const p1 = e.target.pass1.value, p2 = e.target.pass2.value;
      const msgEl = $("pass-msg");
      if (!p1.trim() || p1 !== p2) { msgEl.innerHTML = `<p class="err">تأكد من تطابق الرمز الجديد في الحقلين</p>`; return; }
      STATE.settings.passcode = p1;
      storSet("settings", STATE.settings);
      msgEl.innerHTML = `<p class="muted" style="font-size:.85rem">تم تحديث رمز الدخول</p>`;
      e.target.reset();
      setTimeout(() => { if (msgEl) msgEl.innerHTML = ""; }, 2500);
    };
  }
}

render();
</script>
</body>
</html>
